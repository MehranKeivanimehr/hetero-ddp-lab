name: offline tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - run: pip install -r requirements-analysis.txt
      - name: Unit, data-invariant and privacy tests (no GPU needed)
        run: python -m pytest
      - name: Raw data reproduce the processed tables
        run: python scripts/check_reproducibility.py
      - name: Figures render from the processed tables
        run: python -m hddp.figures --stage final --outdir "$RUNNER_TEMP/figures"
